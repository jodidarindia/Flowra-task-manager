{% extends "base.html" %}

{% block content %}

<style>
    /* 
      Animations and Pseudo-classes (Hover/Focus) 
      These cannot be written as inline styles. 
    */
    @keyframes moveBlob {
        0% { transform: translate(0, 0); }
        100% { transform: translate(70px, -60px); }
    }
    
    .login-card-custom {
        transition: transform 0.3s ease;
    }
    .login-card-custom:hover {
        transform: translateY(-4px);
    }
    
    .login-input-custom:focus {
        border-color: #2563eb !important;
        box-shadow: 0 0 0 3px rgba(37,99,235,0.15) !important;
    }
    
    .login-btn-custom:hover {
        transform: translateY(-2px);
    }
</style>

<!-- particles -->
<div id="particles-js" style="position:fixed; top:0; left:0; width:100%; height:100%; z-index:-2;"></div>

<!-- Animated Background Blobs -->
<div style="position:fixed; inset:0; z-index:-1; overflow:hidden;">
    <div style="position:absolute; border-radius:50%; filter:blur(120px); opacity:.6; animation:moveBlob 18s infinite alternate ease-in-out; width:420px; height:420px; background:#2563eb; top:-120px; left:-120px;"></div>
    <div style="position:absolute; border-radius:50%; filter:blur(120px); opacity:.6; animation:moveBlob 22s infinite alternate ease-in-out; width:420px; height:420px; background:#7c3aed; bottom:-140px; right:-120px;"></div>
    <div style="position:absolute; border-radius:50%; filter:blur(120px); opacity:.6; animation:moveBlob 26s infinite alternate ease-in-out; width:300px; height:300px; background:#38bdf8; top:40%; left:45%;"></div>
</div>

<!-- Login Section -->
<div class="d-flex justify-content-center align-items-center" style="padding:80px 20px; min-height: 100vh;">

    <!-- Login Card -->
    <div class="login-card-custom" style="width:420px; background:#ffffff; border-radius:22px; box-shadow:0 20px 60px rgba(0,0,0,0.12); padding:40px; border:1px solid rgba(226,232,240,0.9); position:relative; z-index:2; transform:none !important; backdrop-filter:none !important; -webkit-backdrop-filter:none !important; filter:none !important;">

        <h3 style="text-align:center; margin-bottom:25px; font-weight:700;">Login to Flowra</h3>

        <div id="messageBox"></div>

        <form method="POST" id="loginForm">

            <div class="position-relative mb-3">
                <i class="fa fa-user" style="position:absolute; left:12px; top:50%; transform:translateY(-50%); color:#2563eb;"></i>
                <input class="login-input-custom" type="text" name="username" placeholder="Username" required style="width:100%; padding:12px 12px 12px 42px; border-radius:12px; border:1px solid #d1d5db; outline:none; transition:0.25s;">
            </div>

            <div class="position-relative mb-3">
                <i class="fa fa-lock" style="position:absolute; left:12px; top:50%; transform:translateY(-50%); color:#2563eb;"></i>
                <input class="login-input-custom" type="password" name="password" id="password" placeholder="Password" required style="width:100%; padding:12px 12px 12px 42px; border-radius:12px; border:1px solid #d1d5db; outline:none; transition:0.25s;">
                <i class="fa fa-eye" onclick="togglePassword()" style="position:absolute; right:12px; top:50%; transform:translateY(-50%); cursor:pointer; color:#6b7280;"></i>
            </div>

            <button class="login-btn-custom" type="submit" style="width:100%; padding:12px; border:none; border-radius:12px; background:linear-gradient(135deg,#2563eb,#7c3aed); color:white; font-weight:600; box-shadow:0 10px 30px rgba(37,99,235,0.35); transition:.3s;">
                <i class="fa fa-sign-in-alt"></i> Login
            </button>

        </form>

        <div id="loaderBox" style="display:none; text-align:center; padding-top:10px;">
            <h5 style="margin-bottom:16px; font-weight:600; color:#2563eb;">Waiting for approval...</h5>
            <div class="spinner-border text-primary" role="status"></div>
            <p style="font-size:14px; color:#6b7280; margin-top:12px;">Please wait while the authorized user allows or denies this login.</p>
        </div>

        <div style="margin-top:15px; text-align:center; font-size:13px; color:#6b7280;">
            Secure login for Flowra Task Manager
        </div>

    </div>

</div>

<!-- particles library -->
<script src="https://cdn.jsdelivr.net/npm/particles.js@2.0.0/particles.min.js"></script>

<script>

/* PARTICLES */
particlesJS("particles-js",{
    particles:{
        number:{value:60},
        size:{value:3},
        color:{value:"#2563eb"},
        line_linked:{
            enable:true,
            color:"#2563eb",
            opacity:0.2
        },
        move:{
            speed:1.5
        }
    }
})

/* SHOW PASSWORD */
function togglePassword(){
    let pass = document.getElementById("password")
    if(pass.type === "password"){
        pass.type = "text"
    }else{
        pass.type = "password"
    }
}

function showMessage(type, text){
    document.getElementById("messageBox").innerHTML =
        `<div class="alert alert-${type} mb-3">${text}</div>`;
}

function checkLoginStatus(token){
    const interval = setInterval(function(){
        fetch("/check-login-status/" + token)
        .then(res => res.json())
        .then(data => {

            if(data.status === "Approved"){
                clearInterval(interval);
                window.location.href = "/complete-login/" + token;
            }

            if(data.status === "Denied"){
                clearInterval(interval);
                document.getElementById("loaderBox").style.display = "none";
                document.getElementById("loginForm").style.display = "block";
                showMessage("danger", "Access denied");
            }

        });
    }, 2000);
}

document.getElementById("loginForm").addEventListener("submit", function(e){
    e.preventDefault();

    const form = this;
    const formData = new FormData(form);

    fetch("/login", {
        method: "POST",
        body: formData
    })
    .then(res => res.json())
    .then(data => {

        if(data.status === "success"){
            window.location.href = data.redirect;
        }

        else if(data.status === "waiting"){
            document.getElementById("messageBox").innerHTML = "";
            document.getElementById("loginForm").style.display = "none";
            document.getElementById("loaderBox").style.display = "block";
            checkLoginStatus(data.token);
        }

        else{
            showMessage("danger", data.message || "Login failed");
        }

    })
    .catch(() => {
        showMessage("danger", "Something went wrong. Please try again.");
    });
});

</script>

{% endblock %}
