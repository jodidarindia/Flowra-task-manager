{% extends "base.html" %}
{% block title %}Create Recurring Task{% endblock %}
{% block content %}

<style>

.recurring-content{
    padding:0 22px;
    max-width:1920px;
    margin:0 auto;
}

.form-card{
    background:#fff;
    border-radius:20px;
    box-shadow:0 18px 45px rgba(2,12,27,0.1);
    border:1px solid var(--fw-border);
    overflow:hidden;
}

.form-card .card-head{
    background:var(--fw-grad);
    color:#fff;
    padding:20px 28px;
    font-weight:500;
}

.form-card .card-body{
    padding:30px;
}

</style>

<div class="recurring-content pt-4">

<div class="fw-banner">
    <div>
        <h2><i class="fa-solid fa-rotate me-2"></i>Create Recurring Task</h2>
        <p>Schedule a task that repeats on a daily, weekly or monthly basis.</p>
    </div>
</div>

<div class="form-card mb-4">

<div class="card-head">
    <i class="fa-solid fa-calendar-plus me-2"></i>Recurring Task Details
</div>

<div class="card-body">

<form method="POST">

<div class="mb-3">
<label class="fw-label">Task Title</label>
<input type="text"
name="title"
class="form-control fw-form-control"
placeholder="Enter task title"
required>
</div>

<div class="mb-3">
<label class="fw-label">Description</label>
<textarea name="description"
class="form-control fw-form-control"
rows="2"
placeholder="Task description (optional)"></textarea>
</div>

<div class="mb-3">
<label class="fw-label">Assign Employee</label>
<select name="assigned_to"
class="form-select fw-form-select"
required>
<option value="" disabled selected>Select Employee</option>
{% for emp in employees %}
<option value="{{ emp.id }}">
{{ emp.username }}
</option>
{% endfor %}
</select>
</div>

<div class="row">
<div class="col-md-6 mb-3">
<label class="fw-label">Start Date &amp; Time</label>
<input type="datetime-local"
name="start_date"
class="form-control fw-form-control"
required>
</div>

<div class="col-md-6 mb-3">
<label class="fw-label">Repeat Until (&amp; Time)</label>
<input type="datetime-local"
name="end_date"
class="form-control fw-form-control"
required>
</div>
</div>

<div class="mb-3">
<label class="fw-label">Frequency</label>
<select name="frequency" class="form-select fw-form-select" required>
<option value="daily">Daily</option>
<option value="weekly">Weekly</option>
<option value="monthly">Monthly</option>
</select>
</div>

<div class="row">
<div class="col-md-6 mb-3">
<label class="fw-label">Reward Points</label>
<select name="reward_points" class="form-select fw-form-select" required>
<option value="50" selected>50</option>
<option value="100">100</option>
<option value="150">150</option>
</select>
</div>

<div class="col-md-6 mb-3">
<label class="fw-label">Priority</label>
<select name="priority" class="form-select fw-form-select" required>
<option value="Low">Low</option>
<option value="Medium" selected>Medium</option>
<option value="High">High</option>
</select>
</div>
</div>

<div class="mb-3">
<label class="fw-label">Sub Tasks</label>
<div class="d-flex gap-2 mb-2">
<input type="text" id="subtaskInput" class="form-control fw-form-control" placeholder="Type a sub task and press Add">
<button type="button" id="addSubtaskBtn" class="fw-btn fw-btn-primary fw-btn-sm">Add</button>
</div>
<div id="subtaskList" class="mt-2"></div>
<input type="hidden" name="subtask_titles" id="subtaskTitles" value="">
</div>

<div class="d-flex gap-2 flex-wrap">

<button type="submit" class="fw-btn fw-btn-primary flex-fill">
<i class="fa-solid fa-plus me-1"></i> Create Task
</button>

<button type="button" onclick="history.back()" class="fw-btn fw-btn-outline">
<i class="fa-solid fa-arrow-left me-1"></i> Back
</button>

</div>

</form>

</div>

</div>

</div>

<script>
document.querySelector("form").addEventListener("submit", function(e){
    const start = new Date(document.querySelector("[name='start_date']").value);
    const end = new Date(document.querySelector("[name='end_date']").value);

    if(end < start){
        alert("End date must be after Start date");
        e.preventDefault();
    }
});

function initSubtask(){
    const input = document.getElementById('subtaskInput');
    const addBtn = document.getElementById('addSubtaskBtn');
    const list = document.getElementById('subtaskList');
    const hidden = document.getElementById('subtaskTitles');

    let items = [];

    function syncHidden(){
        hidden.value = JSON.stringify(items);
    }

    function render(){
        list.innerHTML = '';
        items.forEach((t, i) => {
            const row = document.createElement('div');
            row.className = 'd-flex align-items-center justify-content-between gap-2 mb-1 p-2 border rounded-3 bg-light';
            row.innerHTML = '<span class="small">' + t + '</span>' +
                '<button type="button" class="btn btn-sm btn-outline-danger fw-remove-sub py-0">' +
                '<i class="fa-solid fa-xmark"></i></button>';
            row.querySelector('.fw-remove-sub').addEventListener('click', () => {
                items.splice(i, 1);
                render();
            });
            list.appendChild(row);
        });
        syncHidden();
    }

    function add(){
        const v = input.value.trim();
        if(!v) return;
        items.push(v);
        input.value = '';
        render();
    }

    addBtn.addEventListener('click', add);
    input.addEventListener('keydown', e => {
        if(e.key === 'Enter'){
            e.preventDefault();
            add();
        }
    });
}

document.addEventListener('DOMContentLoaded', initSubtask);
</script>

{% endblock %}
