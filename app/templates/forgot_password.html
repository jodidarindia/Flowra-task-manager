{% extends "base.html" %}

{% block content %}

<style>
    body{
        padding-top: 0 !important;
    }
    .login-card-custom {
        transition: box-shadow 0.3s ease;
    }
    .login-card-custom:hover {
        box-shadow: 0 15px 40px rgba(0,0,0,0.08) !important;
    }

    .login-input-custom:focus {
        border-color: #2563eb !important;
        background-color: #ffffff !important;
        box-shadow: 0 0 0 3px rgba(37,99,235,0.15) !important;
    }

    .login-btn-custom:hover {
        background-color: #1d4ed8 !important;
    }

    .footer-link:hover {
        text-decoration: underline !important;
    }
</style>

<!-- Main Wrapper -->
<div class="d-flex flex-column justify-content-center align-items-center" style="min-height: 100vh; background-color: #f8fafc; padding: 40px 20px;">

    <!-- Top Header Area -->
    <div class="text-center" style="margin-bottom: 25px;">
        <img src="{{ url_for('static', filename='images/flowra(2).png') }}" alt="FLOWRA Logo" style="width: 100px; height: 100px; object-fit: contain;">
        <h1 style="font-size: 32px; font-weight:500; color: #0f172a; margin-bottom: 5px; letter-spacing: -0.5px;">FLOWRA</h1>
        <p style="font-size: 15px; color: #64748b; margin-bottom: 0;">Reset Your Password</p>
    </div>

    <!-- Reset Password Card -->
    <div class="login-card-custom" style="width: 100%; max-width: 440px; background: #ffffff; border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.04); padding: 40px; border: 1px solid #e2e8f0; position: relative; z-index: 2;">

        <div id="messageBox"></div>

        <form method="POST" id="resetForm">

            <!-- Username Field -->
            <div style="margin-bottom: 20px;">
                <label style="display: block; font-size: 14px; font-weight:500; color: #334155; margin-bottom: 8px;">Username</label>
                <input class="login-input-custom" type="text" name="username" placeholder="Enter your username" required style="width: 100%; padding: 14px 16px; border-radius: 10px; border: 1px solid transparent; background-color: #eef2f6; color: #0f172a; font-size: 15px; outline: none; transition: 0.25s;">
            </div>

            <!-- New Password Field -->
            <div class="position-relative" style="margin-bottom: 20px;">
                <label style="display: block; font-size: 14px; font-weight:500; color: #334155; margin-bottom: 8px;">New Password</label>
                <input class="login-input-custom" type="password" name="new_password" id="new_password" placeholder="At least 6 characters" required style="width: 100%; padding: 14px 45px 14px 16px; border-radius: 10px; border: 1px solid transparent; background-color: #eef2f6; color: #0f172a; font-size: 15px; outline: none; transition: 0.25s;">
                <i class="fa fa-eye" onclick="togglePassword('new_password')" style="position: absolute; right: 16px; top: 44px; cursor: pointer; color: #94a3b8; transition: 0.2s;"></i>
            </div>

            <!-- Confirm Password Field -->
            <div class="position-relative" style="margin-bottom: 24px;">
                <label style="display: block; font-size: 14px; font-weight:500; color: #334155; margin-bottom: 8px;">Confirm New Password</label>
                <input class="login-input-custom" type="password" name="confirm_password" id="confirm_password" placeholder="Re-enter new password" required style="width: 100%; padding: 14px 45px 14px 16px; border-radius: 10px; border: 1px solid transparent; background-color: #eef2f6; color: #0f172a; font-size: 15px; outline: none; transition: 0.25s;">
                <i class="fa fa-eye" onclick="togglePassword('confirm_password')" style="position: absolute; right: 16px; top: 44px; cursor: pointer; color: #94a3b8; transition: 0.2s;"></i>
            </div>

            <!-- Submit Button -->
            <button class="login-btn-custom" type="submit" style="width: 100%; padding: 14px; border: none; border-radius: 10px; background-color: #2563eb; color: #ffffff; font-size: 16px; font-weight:500; transition: 0.3s; margin-bottom: 20px;">
                Reset Password
            </button>

            <div style="text-align: center; font-size: 13px; color: #64748b;">
                Remembered your password?
                <a href="{{ url_for('main.login') }}" class="footer-link" style="color: #2563eb; font-weight: 500; text-decoration: none;">Sign In</a>
            </div>

        </form>

    </div>

    <!-- Footer Disclaimer Text -->
    <div class="text-center" style="max-width: 600px; margin-top: 40px; padding: 0 20px;">
        <p style="font-size: 12px; color: #94a3b8; font-weight:500;">
            © 2026 JODIDAR INDIA. FLOWRA is a brand owned by JODIDAR INDIA.
        </p>
    </div>

</div>

<script>
function togglePassword(id){
    var pass = document.getElementById(id);
    if(pass.type === "password"){
        pass.type = "text";
    }else{
        pass.type = "password";
    }
}

document.getElementById("resetForm").addEventListener("submit", function(e){
    var pwd = document.getElementById("new_password").value;
    var confirmPwd = document.getElementById("confirm_password").value;
    if(pwd !== confirmPwd){
        e.preventDefault();
        var box = document.getElementById("messageBox");
        box.innerHTML = '<div class="alert alert-danger mb-3" style="font-size: 14px;">Passwords do not match.</div>';
        return;
    }
    if(pwd.length < 6){
        e.preventDefault();
        var box = document.getElementById("messageBox");
        box.innerHTML = '<div class="alert alert-danger mb-3" style="font-size: 14px;">Password must be at least 6 characters.</div>';
    }
});
</script>

{% endblock %}
